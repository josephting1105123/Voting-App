<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#E3DCCE">
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="icon" type="image/png" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <title>Quick Vote</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body data-page="home">
  <header class="topbar"><div class="topbar-inner"><a class="wordmark" href="https://entropicsoftwarelabs.com/" aria-label="Entropic Software Labs"><span class="mark" aria-hidden="true"><svg viewBox="76 82 360 360" fill="none" stroke="currentColor" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" focusable="false"><mask id="mark-liquid"><path d="M216 104v104L128 372a32 32 0 0 0 28 48h200a32 32 0 0 0 28-48L296 208V104z" fill="#fff" stroke="none"/><path d="M216 104v104L128 372a32 32 0 0 0 28 48h200a32 32 0 0 0 28-48L296 208V104" stroke="#000" stroke-width="60"/></mask><rect x="0" y="310" width="512" height="202" fill="currentColor" stroke="none" mask="url(#mark-liquid)"/><path d="M216 104v104L128 372a32 32 0 0 0 28 48h200a32 32 0 0 0 28-48L296 208V104"/><path d="M196 104h120"/></svg></span><span class="wordmark-text"><span class="brand-short">Entropic</span><span class="brand-rest"> Software Labs</span></span></a><div class="topbar-controls"><div class="slider" id="role-slider" role="radiogroup" aria-label="Mode" data-index="0" data-c0="voter" data-c1="admin"><span class="slider-thumb" aria-hidden="true"></span><button type="button" role="radio" class="slider-opt" data-href="/" aria-checked="true" tabindex="0">Voter</button><button type="button" role="radio" class="slider-opt" data-href="/create.html" aria-checked="false" tabindex="-1">Admin</button></div></div></div></header>
  <main class="container container-home">
    <section class="hero"><div class="hero-bars" aria-hidden="true"><span></span><span></span><span></span></div><h1>Put it to a vote.</h1><p class="lead">Make a poll, read out the 6-digit PIN, and everyone votes from their phone. No accounts, nothing to install.</p></section>

    <div class="home-side">
    <section class="card" aria-labelledby="join-heading">
      <h2 id="join-heading">Join a poll</h2>
      <form id="join-form" novalidate>
        <div class="field">
          <label for="pin">Poll PIN</label>
          <div class="pin-entry" id="pin-entry" data-len="0"><span class="pin-cell" aria-hidden="true"></span><span class="pin-cell" aria-hidden="true"></span><span class="pin-cell" aria-hidden="true"></span><span class="pin-cell" aria-hidden="true"></span><span class="pin-cell" aria-hidden="true"></span><span class="pin-cell" aria-hidden="true"></span><input id="pin" name="pin" type="text" inputmode="numeric" pattern="\d{6}" maxlength="6" autocomplete="off" placeholder="000000" enterkeyhint="next" autocorrect="off" spellcheck="false" required></div>
        </div>
        <div class="field">
          <label for="name">Your name</label>
          <input id="name" name="name" type="text" maxlength="40" autocomplete="nickname" placeholder="The host sees this" enterkeyhint="go" autocapitalize="words" spellcheck="false" required>
        </div>
        <p id="join-error" class="error" role="alert" hidden></p>
        <button class="btn btn-primary btn-block" type="submit">Join</button>
      </form>
    </section>

    <section class="card" id="my-polls" aria-labelledby="my-polls-heading" hidden>
      <h2 id="my-polls-heading">Your polls</h2>
      <ul class="list" id="my-polls-list"></ul>
    </section>
    </div>
  </main>
  <noscript><p class="container">Quick Vote needs JavaScript turned on.</p></noscript>
  <script src="/js/common.js"></script>
</body>
</html>
