<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>Quick Vote - offline</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #4f46e5;
    color: #ffffff;
    text-align: center;
  }
  main { max-width: 22rem; }
  .mark {
    width: 72px;
    height: 72px;
    margin: 0 auto 20px;
    border-radius: 18px;
    background: rgba(255, 255, 255, 0.16);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  h1 { margin: 0 0 12px; font-size: 1.5rem; line-height: 1.25; }
  p { margin: 0 0 28px; font-size: 1rem; line-height: 1.5; color: #e8e7fd; }
  button {
    font: inherit;
    font-weight: 600;
    min-height: 48px;
    padding: 12px 32px;
    border: 0;
    border-radius: 14px;
    background: #ffffff;
    color: #4338ca;
    cursor: pointer;
  }
  button:hover { background: #e8e7fd; }
  button:focus-visible { outline: 3px solid #ffffff; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
  </div>
  <h1>Can't reach Quick Vote</h1>
  <p>Check your internet connection. If nobody has used the app for a while, the server can take up to a minute to wake up.</p>
  <button type="button" id="retry">Try again</button>
</main>
<script>
  document.getElementById('retry').addEventListener('click', function () {
    location.href = 'https://vote.entropicsoftwarelabs.com/';
  });
</script>
</body>
</html>
